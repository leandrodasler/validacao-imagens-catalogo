# Site estático: sem build, publica a raiz do repositório.
[build]
  publish = "."

# Imagens trocam de conteúdo mantendo o nome: cache curto.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Ferramenta interna de validação, com imagens de terceiros: fora dos buscadores.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
