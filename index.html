<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Image Validation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-outer: #dcdce1;
            --panel: #ffffff;
            --ink: #0e0e11;
            --muted: #6c6c78;
            --faint: #9a9aa6;
            --line: #e7e7ec;
            --soft: #f5f5f8;
            --ring: #f3f3f6;
            --blue: #2f55d4;
            --blue-bg: #eaf0ff;
            --amber: #b9791a;
            --amber-bg: #fdf3e0;
            --amber-line: #f1d9a6;
            --green: #1c8a50;
            --green-bg: #e5f5ec;
            --red: #c2372b;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg-outer);
            color: var(--ink);
            min-height: 100vh;
            padding: 28px 24px 40px;
            -webkit-font-smoothing: antialiased;
        }

        .shell {
            max-width: 1360px;
            margin: 0 auto;
            background: var(--panel);
            border-radius: 28px;
            padding: 32px 40px 28px;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 24px 60px -20px rgba(20, 20, 40, 0.25), 0 0 0 1px rgba(20, 20, 40, 0.05);
        }

        button, input {
            font-family: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }

        svg {
            flex-shrink: 0;
        }

        /* Header */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 36px;
        }

        .breadcrumb .crumb-current {
            color: var(--muted);
        }

        .breadcrumb .crumb-parent {
            color: var(--ink);
            font-weight: 500;
        }

        .title-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 40px;
            line-height: 1.1;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--muted);
        }

        .subtitle strong {
            color: var(--ink);
            font-weight: 500;
        }

        /* Segmented control */
        .segmented {
            display: inline-flex;
            gap: 2px;
            padding: 4px;
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 14px;
        }

        .segmented button {
            border: 0;
            background: transparent;
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: background 0.15s, color 0.15s, box-shadow 0.15s;
        }

        .segmented button:hover {
            color: var(--ink);
        }

        .segmented button[aria-pressed="true"] {
            background: var(--panel);
            color: var(--ink);
            box-shadow: 0 1px 2px rgba(20, 20, 40, 0.12), 0 0 0 1px rgba(20, 20, 40, 0.04);
        }

        /* Stat cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px 20px 16px;
            box-shadow: 0 0 0 5px var(--ring);
        }

        .stat-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .label {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stat-count {
            font-size: 14px;
            color: var(--muted);
        }

        .stat-value {
            font-size: 40px;
            font-weight: 400;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .bars {
            display: grid;
            grid-template-columns: repeat(44, 1fr);
            gap: 2px;
            height: 22px;
            margin-bottom: 12px;
        }

        .bars span {
            background: #e9e9ee;
            border-radius: 1px;
        }

        .bars span.on {
            background: var(--bar-color, var(--ink));
        }

        .stat-note {
            font-size: 14px;
            color: var(--muted);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 22px;
        }

        .search {
            position: relative;
            flex: 1 1 320px;
            max-width: 520px;
        }

        .search svg.icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--faint);
            pointer-events: none;
        }

        .search input {
            width: 100%;
            height: 48px;
            padding: 0 52px 0 44px;
            font-size: 15px;
            color: var(--ink);
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 14px;
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }

        .search input::placeholder {
            color: var(--faint);
        }

        .search input:focus {
            outline: none;
            background: var(--panel);
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(47, 85, 212, 0.12);
        }

        .search kbd {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 2px 8px;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .card {
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 1px 2px rgba(20, 20, 40, 0.04);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px -12px rgba(20, 20, 40, 0.22);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--soft);
            color: #4a4a55;
        }

        .chip.blue {
            background: var(--blue-bg);
            border-color: #cddafb;
            color: var(--blue);
        }

        .chip.amber {
            background: var(--amber-bg);
            border-color: var(--amber-line);
            color: var(--amber);
        }

        .file {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--faint);
        }

        .thumb {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            background: var(--soft);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            padding: 10px;
            mix-blend-mode: multiply;
        }

        .thumb.pending {
            flex-direction: column;
            gap: 8px;
            background: #f8f8fa;
            border: 1.5px dashed #d3d3db;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            padding: 12px;
        }

        .thumb.pending .pending-icon {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--amber-bg);
            color: var(--amber);
        }

        .thumb.pending strong {
            color: var(--ink);
            font-weight: 500;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .card-path {
            flex-grow: 1;
            font-size: 12.5px;
            line-height: 1.4;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .card-footer {
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 36px;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            text-decoration: none;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(20, 20, 40, 0.05);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .btn:hover {
            background: var(--soft);
            border-color: #d8d8df;
        }

        .btn.copied {
            background: var(--green-bg);
            border-color: #bfe6cf;
            color: var(--green);
        }

        .empty {
            display: none;
            text-align: center;
            padding: 56px 20px;
            color: var(--muted);
            font-size: 15px;
            border: 1.5px dashed #d3d3db;
            border-radius: 18px;
            background: #f8f8fa;
        }

        .page-footer {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
            font-size: 14px;
            color: var(--muted);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--ink);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 720px) {
            body { padding: 12px 10px 28px; }
            .shell { padding: 22px 18px 20px; border-radius: 22px; }
            .breadcrumb { margin-bottom: 24px; }
            h1 { font-size: 32px; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
            .search { max-width: none; }
        }
    </style>
</head>

            { category: 188, name: "Hard Hats", path: "Safety > Head Protection > Hard Hats", image: "images/img_188.jpg" },
            { category: 189, name: "Head Protection", path: "Safety > Head Protection", image: null },
            { category: 190, name: "Hard Hats", path: "Safety > Head Protection > Hard Hats", image: "images/img_190.jpg" },
            { category: 191, name: "Bolts", path: "Fasteners - Hardware > Bolts > Bolts", image: null },
        ];

        const gallery = document.getElementById('gallery');
        const filterInput = document.getElementById('categoryFilter');
        const noResults = document.getElementById('noResults');
        const showing = document.getElementById('showing');
        const statusButtons = document.querySelectorAll('.segmented button');

        const state = { query: '', status: 'all' };

        const total = products.length;
        const pendingProducts = products.filter(p => !p.image);
        const readyCount = total - pendingProducts.length;

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function svgIcon(markup, size) {
            const wrap = el('span');
            wrap.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${markup}</svg>`;
            return wrap.firstChild;
        }

        const ICONS = {
            image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m21 16-5-5-8 9"/>',
            external: '<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',
            copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'
        };

        function showToast(message) {
            const toast = el('div', 'toast', message);
            toast.setAttribute('role', 'status');
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const label = btn.querySelector('span');
                label.textContent = 'Copied';
                btn.classList.add('copied');
                showToast('URL copied!');
                setTimeout(() => {
                    label.textContent = 'Copy URL';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                showToast('Could not copy the URL');
            });
        }

        function buildBars(ratio, color) {
            const bars = el('div', 'bars');
            bars.style.setProperty('--bar-color', color);
            const count = 44;
            const filled = Math.round(ratio * count);
            for (let i = 0; i < count; i++) {
                bars.appendChild(el('span', i < filled ? 'on' : ''));
            }
            return bars;
        }

        function buildStat({ label, count, value, valueColor, ratio, barColor, note }) {
            const card = el('div', 'stat');
            const top = el('div', 'stat-top');
            top.append(el('span', 'label', label), el('span', 'stat-count', count));
            const big = el('div', 'stat-value', value);
            if (valueColor) big.style.color = valueColor;
            card.append(top, big, buildBars(ratio, barColor), el('div', 'stat-note', note));
            return card;
        }

        function renderSummary() {
            const subtitle = document.getElementById('subtitle');
            subtitle.append(`${total} categories in the VTEX catalog. `);
            const strong = el('strong');
            strong.textContent = pendingProducts.length === 0
                ? 'All of them have an image.'
                : `${pendingProducts.length} ${pendingProducts.length === 1 ? 'is' : 'are'} missing an image and need attention.`;
            subtitle.appendChild(strong);

            const pendingIds = pendingProducts.map(p => p.category);
            const pendingList = pendingIds.length <= 6
                ? pendingIds.join(', ')
                : `${pendingIds.slice(0, 3).join(', ')} and ${pendingIds.length - 3} more`;
            document.getElementById('stats').append(
                buildStat({
                    label: 'Categories', count: 'total', value: String(total),
                    ratio: 1, barColor: 'var(--ink)', note: 'Categories in the VTEX tree'
                }),
                buildStat({
                    label: 'With image', count: `${readyCount} of ${total}`,
                    value: `${Math.round((readyCount / total) * 100)}%`, valueColor: 'var(--green)',
                    ratio: readyCount / total, barColor: 'var(--green)', note: 'Ready to be reviewed'
                }),
                buildStat({
                    label: 'Pending', count: `${pendingProducts.length} ${pendingProducts.length === 1 ? 'category' : 'categories'}`,
                    value: String(pendingProducts.length), valueColor: pendingProducts.length ? 'var(--amber)' : undefined,
                    ratio: pendingProducts.length / total, barColor: 'var(--amber)',
                    note: pendingProducts.length ? `Waiting for an image: cat ${pendingList}` : 'Nothing waiting'
                })
            );
        }

        function createCard(product) {
            const card = el('article', 'card');

            const top = el('div', 'card-top');
            top.appendChild(el('span', 'chip', `Cat ${product.category}`));
            if (product.image) {
                top.appendChild(el('span', 'file', product.image.replace('images/', '')));
            } else {
                top.appendChild(el('span', 'chip amber', 'No image'));
            }
            card.appendChild(top);

            if (product.image) {
                const thumb = el('div', 'thumb');
                const img = document.createElement('img');
                img.src = product.image;
                img.alt = product.name;
                img.loading = 'lazy';
                thumb.appendChild(img);
                card.appendChild(thumb);
            } else {
                const thumb = el('div', 'thumb pending');
                const icon = el('span', 'pending-icon');
                icon.appendChild(svgIcon(ICONS.image, 20));
                const text = el('div');
                text.append(el('strong', '', 'Pending image'), document.createElement('br'), `Cat ${product.category} is waiting for a file`);
                thumb.append(icon, text);
                card.appendChild(thumb);
            }

            card.append(el('div', 'card-title', product.name), el('div', 'card-path', product.path === product.name ? 'Top-level category' : product.path));

            if (product.image) {
                const footer = el('div', 'card-footer');

                const view = el('a', 'btn');
                view.href = product.image;
                view.target = '_blank';
                view.rel = 'noopener';
                view.append(svgIcon(ICONS.external, 14), el('span', '', 'View'));

                const copy = el('button', 'btn');
                copy.type = 'button';
                copy.append(svgIcon(ICONS.copy, 14), el('span', '', 'Copy URL'));
                const fullUrl = new URL(product.image, window.location.href).href;
                copy.addEventListener('click', () => copyToClipboard(fullUrl, copy));

                footer.append(view, copy);
                card.appendChild(footer);
            }

            return card;
        }

        function render() {
            const query = state.query.trim();
            const filtered = products.filter(p => {
                if (state.status === 'ready' && !p.image) return false;
                if (state.status === 'pending' && p.image) return false;
                return query === '' || String(p.category) === query;
            });

            gallery.innerHTML = '';
            showing.textContent = `Showing ${filtered.length} of ${total} categories`;

            if (filtered.length === 0) {
                gallery.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            gallery.style.display = 'grid';
            noResults.style.display = 'none';

            [...filtered]
                .sort((a, b) => a.category - b.category)
                .forEach(product => gallery.appendChild(createCard(product)));
        }

        filterInput.addEventListener('input', () => {
            state.query = filterInput.value;
            render();
        });

        statusButtons.forEach(button => {
            button.addEventListener('click', () => {
                state.status = button.dataset.status;
                statusButtons.forEach(b => b.setAttribute('aria-pressed', String(b === button)));
                render();
            });
        });

        document.addEventListener('keydown', event => {
            if (event.key === '/' && document.activeElement !== filterInput) {
                event.preventDefault();
                filterInput.focus();
            } else if (event.key === 'Escape' && document.activeElement === filterInput) {
                filterInput.value = '';
                state.query = '';
                filterInput.blur();
                render();
            }
        });

        renderSummary();
        render();
    </script>
